<app-default-login-layout
  title="Sign in and Start today"
  primaryBtnText="Signup now"
  secondaryBtnText="Login now"
  (submit)="submit()"
  (navigate)="navigate()"
  [disablePrimaryBtn]="!signupForm.valid"
>
  <form [formGroup]="signupForm">
    <app-primary-input
      formControlName="name"
      inputName="name"
      type="text"
      label="Your name"
      placeholder="John Doe"
    >
     <img src="assets/svg/iconEmail.svg" alt="">
    </app-primary-input>

    <app-primary-input
      formControlName="email"
      inputName="email"
      type="email"
      label="Email"
      placeholder="johndoe@gmail.com"
    >
      <img src="assets/svg/iconEmail.svg" alt="">
    </app-primary-input>

     <app-primary-input
      formControlName="password"
      inputName="password"
      type="password"
      label="Your password"
    >
      <img src="assets/svg/iconPassword.svg" alt="">
    </app-primary-input>
  </form>
</app-default-login-layout>
