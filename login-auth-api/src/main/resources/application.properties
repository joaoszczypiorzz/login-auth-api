# CONFIGURA합ES DO SPRING E SERVIDOR:

spring.application.name=login-auth-api
spring.profiles.active=dev
server.port=8081

# CONFIGURA합ES DE BANCO DE DADOS:

spring.datasource.url=jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# CONFIGURA합ES HIBERNATE:

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

